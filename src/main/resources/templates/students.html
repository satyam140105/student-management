<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Student Registration</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<h1>Student Registration</h1>

<form th:action="@{/save}"
      th:object="${student}"
      method="post">

    <input type="text"
           th:field="*{name}"
           placeholder="Name">

    <br><br>

    <input type="email"
           th:field="*{email}"
           placeholder="Email">

    <br><br>

    <input type="text"
           th:field="*{course}"
           placeholder="Course">

    <br><br>

    <button type="submit">
        Save
    </button>

</form>

<hr>

<table border="1">

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Course</th>
    </tr>

    <tr th:each="s : ${students}">
        <td th:text="${s.id}"></td>
        <td th:text="${s.name}"></td>
        <td th:text="${s.email}"></td>
        <td th:text="${s.course}"></td>
    </tr>

</table>

</body>
</html>
